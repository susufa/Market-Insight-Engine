[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-insight-engine"
version = "0.50.0"
description = "Local-first, modular stock market data analysis and prediction platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web Framework & API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Data Validation & Settings
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Data Processing
    "polars>=1.12",
    "pyarrow>=17",
    # Local Analytics DB
    "duckdb>=1.1",
    # Metadata & Task State
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20",
    # Data Source Adapter
    "akshare>=1.14",
    # Scheduling
    "apscheduler>=3.10",
    # HTTP Client (for adapters)
    "httpx>=0.27",
    # ML & Statistical Prediction Engine (Phase 5)
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "scipy>=1.12",
    # Utilities
    "tenacity>=9.0",          # Retry with exponential backoff
    "cachetools>=5.5",        # LRU in-memory cache
    "rich>=13.9",             # Pretty console output / logging
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",            # For FastAPI TestClient
    "ruff>=0.7",
    "mypy>=1.12",
    "pre-commit>=4.0",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
]
gpu = [
    "torch>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff – Linting & Formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"src/api/*" = ["B008"]

# ---------------------------------------------------------------------------
# Mypy – Static Type Checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "scripts/"]

# ---------------------------------------------------------------------------
# Pytest & Coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
addopts = "--cov=core --cov=config --cov=api --cov=adapters --cov=quality --cov=storage --cov=analysis --cov-report=term-missing --cov-report=html:reports/coverage"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "config", "api", "adapters", "quality", "storage", "analysis"]
branch = true
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
